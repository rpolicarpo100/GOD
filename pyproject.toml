[project]
name = "god"
version = "7.4.0"
description = "GOD — Living Intelligence. Local-first AI assistant with multi-provider routing."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "rpolicarpo100"}]
readme = "README.md"

dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.24",
    "tiktoken>=0.5",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lxml>=4.9",
    "qdrant-client>=1.6",
]

[project.optional-dependencies]
neural = ["fastembed>=0.2", "onnxruntime>=1.16"]
voice = ["edge-tts>=6.1"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "E741", "F841"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*", "P*", "*Test"]
