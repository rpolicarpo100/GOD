# GOD — config verificada neste host (2026-09-04)
# Ausente = unavailable. Não se inventa.

mode: auto  # auto | token_saver | conservative | offline | normal

budgets:
  task: 8000
  session: 50000
  daily: 200000
  project: 2000000
  agent: 40000

governor:
  strict: true
  fs_root: /home/user
  python_timeout_s: 8
  deny_names:
    - ".env"
    - ".netrc"
    - "credentials"
    - "id_rsa"
    - ".git-credentials"

thresholds:
  accept: 70
  max_retries: 3

unverified_or_absent:
  - PostgreSQL (SQLite em uso)
  - Redis/Valkey (cache SQLite)
  - Qdrant server :6333 (embedded local sim)
  - embeddings neurais (HashingVectorizer 384)
  - Ollama :11434 fechado
  - OmniRoute :20128 fechado
  - SearXNG
  - Docker
  - Plane no produto (sem workspace_slug)
  - preços de modelos (cost=UNKNOWN)
  - Langfuse / LiteLLM
  - voz / imagem / nós laptop-mobile
