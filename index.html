<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>GOD — Living Intelligence</title>
<style>
:root {
  --void: #03040a;
  --deep: #07090f;
  --bg: #0a0d16;
  --surface: rgba(140,120,200,.03);
  --glass: rgba(140,120,200,.06);
  --line: rgba(160,140,220,.06);
  --line2: rgba(160,140,220,.12);
  --text: #ddd8ee;
  --muted: #7a7494;
  --dim: #4a4568;
  --accent: #b89eea;
  --accent2: #8b6cc7;
  --glow: rgba(139,108,199,.12);
  --ok: #5ee8b0;
  --ok-dim: rgba(94,232,176,.08);
  --info: #6cc8f0;
  --info-dim: rgba(108,200,240,.08);
  --warn: #f0c050;
  --warn-dim: rgba(240,192,80,.08);
  --crit: #e86060;
  --crit-dim: rgba(232,96,96,.08);
  --evo: #b0a0f0;
  --evo-dim: rgba(176,160,240,.08);
  --mono: 'SF Mono','Cascadia Code',ui-monospace,Menlo,Consolas,monospace;
  --sans: -apple-system,'Segoe UI',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{height:100%;background:var(--void);color:var(--text);font-family:var(--sans);font-size:13px;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;transition-duration:0s!important}}

/* ═══════════════════════════════
   SHELL
   ═══════════════════════════════ */
.shell{display:flex;height:100%;width:100%}

/* ── Rail ── */
.rail{
  width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;
  padding:14px 0;gap:2px;background:var(--deep);border-right:1px solid var(--line);
  z-index:50;
}
.rail-logo{
  width:32px;height:32px;margin-bottom:12px;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.rail-logo::before{
  content:'';position:absolute;inset:0;border-radius:10px;
  background:conic-gradient(from 180deg,var(--accent2),var(--accent),var(--evo),var(--accent2));
  opacity:.18;animation:rail-logo-spin 12s linear infinite;
}
@keyframes rail-logo-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.rail-logo span{font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--accent);position:relative;z-index:1}
.rail-btn{
  width:36px;height:36px;border-radius:10px;border:none;background:transparent;
  color:var(--dim);font-size:15px;display:flex;align-items:center;justify-content:center;
  transition:all .2s ease;position:relative;
}
.rail-btn:hover{color:var(--muted);background:var(--glass)}
.rail-btn.active{color:var(--accent)}
.rail-btn.active::after{
  content:'';position:absolute;left:-6px;top:50%;transform:translateY(-50%);
  width:2px;height:16px;border-radius:0 2px 2px 0;background:var(--accent);
}
.rail-spacer{flex:1}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}

/* ── Header ── */
.header{
  height:40px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;border-bottom:1px solid var(--line);background:var(--deep);flex-shrink:0;
}
.header-left{display:flex;align-items:center;gap:10px}
.header-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600}
.header-right{display:flex;align-items:center;gap:12px}
.h-badge{
  display:flex;align-items:center;gap:4px;font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 8px;border-radius:99px;
  border:1px solid var(--line);color:var(--dim);
}
.h-badge.ok{color:var(--ok);border-color:rgba(94,232,176,.18)}
.h-badge.warn{color:var(--warn);border-color:rgba(240,192,80,.18)}
.h-badge.crit{color:var(--crit);border-color:rgba(232,96,96,.18)}
.h-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.h-clock{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.04em}

/* ═══════════════════════════════
   PAGES
   ═══════════════════════════════ */
.page{flex:1;overflow-y:auto;overflow-x:hidden;display:none;opacity:0;transform:translateY(6px);transition:opacity .3s ease,transform .3s ease}
.page.active{display:block;opacity:1;transform:translateY(0)}

/* ═══════════════════════════════
   HOME — GOD CORE
   ═══════════════════════════════ */
.home{display:flex;flex-direction:column;align-items:center;padding:0;min-height:100%}

/* GOD CORE — organic breathing orb */
.god-core{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;
  padding:28px 0 16px;position:relative;
}
.core-orb{
  width:140px;height:140px;position:relative;
  display:flex;align-items:center;justify-content:center;
}
/* Layers */
.core-layer{
  position:absolute;border-radius:50%;
  transition:all .8s cubic-bezier(.4,0,.2,1);
}
.core-l1{inset:0;opacity:.06;background:radial-gradient(circle,var(--accent) 0%,transparent 70%)}
.core-l2{inset:8px;opacity:.1;border:1px solid var(--accent);border-radius:50%}
.core-l3{inset:18px;opacity:.15;border:1px solid var(--accent2);border-radius:50%}
.core-l4{
  inset:30px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,rgba(139,108,199,.2),rgba(139,108,199,.02));
  border:1px solid rgba(139,108,199,.15);
  display:flex;align-items:center;justify-content:center;
}
.core-iris{
  width:14px;height:14px;border-radius:50%;
  background:var(--accent);position:relative;
  transition:all .5s ease;
}
.core-iris::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,108,199,.3),transparent 70%);
  transition:all .5s ease;
}
/* Breathing */
.core-orb[data-breathing="slow"] .core-l1{animation:orb-breathe-slow 5s ease-in-out infinite}
.core-orb[data-breathing="slow"] .core-l2{animation:orb-breathe-slow 5s ease-in-out infinite .3s}
.core-orb[data-breathing="slow"] .core-l3{animation:orb-breathe-slow 5s ease-in-out infinite .6s}
.core-orb[data-breathing="slow"] .core-iris{opacity:.7;animation:iris-breathe 5s ease-in-out infinite}

.core-orb[data-breathing="ready"] .core-l1{animation:orb-breathe 3.5s ease-in-out infinite}
.core-orb[data-breathing="ready"] .core-l2{animation:orb-breathe 3.5s ease-in-out infinite .2s}
.core-orb[data-breathing="ready"] .core-l3{animation:orb-breathe 3.5s ease-in-out infinite .4s}
.core-orb[data-breathing="ready"] .core-iris{animation:iris-breathe 3.5s ease-in-out infinite}

.core-orb[data-breathing="active"] .core-l1{animation:orb-pulse 1.8s ease-in-out infinite}
.core-orb[data-breathing="active"] .core-l2{animation:orb-pulse 1.8s ease-in-out infinite .15s}
.core-orb[data-breathing="active"] .core-l3{animation:orb-pulse 1.8s ease-in-out infinite .3s}
.core-orb[data-breathing="active"] .core-iris{animation:iris-active 1.8s ease-in-out infinite}

.core-orb[data-breathing="fast"] .core-l1{animation:orb-pulse 1s ease-in-out infinite}
.core-orb[data-breathing="fast"] .core-l2{animation:orb-pulse 1s ease-in-out infinite .1s}
.core-orb[data-breathing="fast"] .core-l3{animation:orb-pulse 1s ease-in-out infinite .2s}
.core-orb[data-breathing="fast"] .core-iris{animation:iris-active 1s ease-in-out infinite}

@keyframes orb-breathe-slow{0%,100%{opacity:.04;transform:scale(.97)}50%{opacity:.08;transform:scale(1.03)}}
@keyframes orb-breathe{0%,100%{opacity:.06;transform:scale(.98)}50%{opacity:.12;transform:scale(1.02)}}
@keyframes orb-pulse{0%,100%{opacity:.08;transform:scale(.96)}50%{opacity:.18;transform:scale(1.04)}}
@keyframes iris-breathe{0%,100%{opacity:.6;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
@keyframes iris-active{0%,100%{opacity:.8;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

/* GOD CORE states */
.core-orb[data-state="idle"] .core-iris{background:var(--dim);box-shadow:none}
.core-orb[data-state="idle"] .core-l2{border-color:var(--dim)}
.core-orb[data-state="idle"] .core-l3{border-color:var(--dim)}

.core-orb[data-state="ready"] .core-iris{background:var(--accent);box-shadow:0 0 20px rgba(139,108,199,.3)}
.core-orb[data-state="ready"] .core-l2{border-color:var(--accent)}
.core-orb[data-state="ready"] .core-l3{border-color:var(--accent2)}

.core-orb[data-state="listening"] .core-iris{background:var(--info);box-shadow:0 0 24px rgba(108,200,240,.35)}
.core-orb[data-state="listening"] .core-l2{border-color:var(--info)}
.core-orb[data-state="listening"] .core-l3{border-color:var(--info)}
.core-orb[data-state="listening"] .core-l1{background:radial-gradient(circle,var(--info) 0%,transparent 70%)}

.core-orb[data-state="thinking"] .core-iris{background:var(--accent);box-shadow:0 0 28px rgba(139,108,199,.4)}
.core-orb[data-state="thinking"] .core-l1{background:radial-gradient(circle,var(--accent) 0%,transparent 70%)}

.core-orb[data-state="tools"] .core-iris{background:var(--evo);box-shadow:0 0 24px rgba(176,160,240,.35)}
.core-orb[data-state="tools"] .core-l2{border-color:var(--evo)}
.core-orb[data-state="tools"] .core-l3{border-color:var(--evo)}
.core-orb[data-state="tools"] .core-l1{background:radial-gradient(circle,var(--evo) 0%,transparent 70%)}

.core-orb[data-state="responding"] .core-iris{background:var(--ok);box-shadow:0 0 24px rgba(94,232,176,.35)}
.core-orb[data-state="responding"] .core-l2{border-color:var(--ok)}
.core-orb[data-state="responding"] .core-l3{border-color:var(--ok)}
.core-orb[data-state="responding"] .core-l1{background:radial-gradient(circle,var(--ok) 0%,transparent 70%)}

.core-orb[data-state="error"] .core-iris{background:var(--crit);box-shadow:0 0 28px rgba(232,96,96,.4);animation:iris-error 1.5s ease-in-out infinite}
.core-orb[data-state="error"] .core-l2{border-color:var(--crit)}
.core-orb[data-state="error"] .core-l3{border-color:var(--crit)}
.core-orb[data-state="error"] .core-l1{background:radial-gradient(circle,var(--crit) 0%,transparent 70%)}
@keyframes iris-error{0%,100%{opacity:1}50%{opacity:.4}}

.core-orb[data-state="offline"] .core-iris{background:var(--dim);box-shadow:none;opacity:.2}
.core-orb[data-state="offline"] .core-l2,.core-orb[data-state="offline"] .core-l3{opacity:.03}
.core-orb[data-state="offline"] .core-l1{opacity:.01}

/* GOD CORE interactive */
.core-orb{cursor:pointer;transition:transform .3s ease}
.core-orb:hover{transform:scale(1.02)}
.core-orb:active{transform:scale(.98)}

.core-name{margin-top:14px;font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--accent);font-weight:600}
.core-status{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:3px;transition:color .4s}

/* ── KPIs ── */
.kpis{display:flex;gap:8px;padding:0 20px;width:100%;max-width:680px;flex-wrap:wrap;justify-content:center;margin:12px 0 16px}
.kpi{
  flex:1;min-width:90px;padding:10px 10px 8px;background:var(--glass);
  border:1px solid var(--line);border-radius:10px;text-align:center;
  transition:border-color .25s,background .25s;
}
.kpi:hover{border-color:var(--line2);background:var(--surface)}
.kpi .k{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.kpi .v{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1}
.kpi .s{font-size:9px;color:var(--muted);margin-top:4px}

/* ── Two-column layout ── */
.home-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  width:100%;max-width:860px;padding:0 20px;flex:1;min-height:0;
}
.panel{
  background:var(--glass);border:1px solid var(--line);border-radius:12px;
  display:flex;flex-direction:column;overflow:hidden;
}
.panel-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 12px;border-bottom:1px solid var(--line);flex-shrink:0;
}
.panel-t{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.panel-b{flex:1;overflow-y:auto;padding:8px 12px}
.panel-b::-webkit-scrollbar{width:3px}

/* ── System map ── */
.smap{display:flex;flex-direction:column;gap:5px}
.sr{display:flex;align-items:center;gap:7px;font-size:11px;cursor:pointer;padding:3px 4px;border-radius:6px;transition:background .15s}
.sr:hover{background:var(--glass)}
.sd{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sd.on{background:var(--ok);box-shadow:0 0 6px rgba(94,232,176,.25)}
.sd.off{background:var(--dim)}
.sd.w{background:var(--warn)}
.sn{width:70px;color:var(--muted);font-size:10px}
.sv{color:var(--text);font-family:var(--mono);font-size:10px}

/* Interactive system map */
.smap-vis{position:relative;width:100%;min-height:180px;margin:8px 0}
.smap-vis-node{
  position:absolute;padding:8px 12px;border-radius:10px;
  background:var(--glass);border:1px solid var(--line);
  cursor:pointer;transition:all .25s ease;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  min-width:70px;text-align:center;
}
.smap-vis-node:hover{border-color:var(--line2);background:var(--surface);transform:scale(1.05)}
.smap-vis-node .nd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.smap-vis-node .nd.on{background:var(--ok);box-shadow:0 0 6px rgba(94,232,176,.3)}
.smap-vis-node .nd.off{background:var(--dim)}
.smap-vis-node .nn{font-size:9px;font-weight:600;color:var(--text);letter-spacing:.04em}
.smap-vis-node .nv{font-size:8px;color:var(--dim)}

/* Connection lines */
.smap-lines{position:absolute;inset:0;z-index:1;pointer-events:none}
.smap-line{stroke:var(--line2);stroke-width:1;fill:none}
.smap-line.active{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3;animation:flow-dash 2s linear infinite}
@keyframes flow-dash{to{stroke-dashoffset:-14}}

/* Data flow dots */
.flow-dot{fill:var(--accent);r:2;opacity:.7}
.flow-dot.animated{animation:flow-pulse 2s ease-in-out infinite}
@keyframes flow-pulse{0%,100%{opacity:.3;r:1.5}50%{opacity:1;r:2.5}}

/* Detail panel */
.smap-detail{
  position:absolute;top:8px;right:8px;min-width:180px;max-width:220px;
  background:var(--deep);border:1px solid var(--line);border-radius:10px;
  padding:10px;z-index:10;font-size:10px;
  opacity:0;transform:translateX(10px);transition:all .2s ease;pointer-events:none;
}
.smap-detail.show{opacity:1;transform:translateX(0);pointer-events:auto}
.smap-detail .dt{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:600}
.smap-detail .dd{color:var(--muted);line-height:1.6}
.smap-detail .dd strong{color:var(--text);font-weight:500}
.smap-detail .dc{margin-top:6px;display:flex;gap:3px;flex-wrap:wrap}
.smap-detail .dc span{font-size:8px;padding:1px 5px;background:var(--glass);border:1px solid var(--line);border-radius:3px}

/* ── Feed ── */
.feed{display:flex;flex-direction:column;gap:3px}
.fr{display:flex;gap:7px;align-items:baseline;font-size:11px;padding:2px 0}
.ft{font-family:var(--mono);font-size:8px;color:var(--dim);min-width:42px;flex-shrink:0}
.fd{width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:5px}
.fd.i{background:var(--info)}.fd.w{background:var(--warn)}.fd.c{background:var(--crit)}.fd.o{background:var(--ok)}.fd.e{background:var(--evo)}
.fm{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}

/* ── Providers ── */
.pv{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:11px}
.pv-d{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.pv-d.up{background:var(--ok)}.pv-d.down{background:var(--dim)}
.pv-n{color:var(--text);font-weight:500;min-width:60px}
.pv-m{color:var(--dim);font-size:9px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ═══════════════════════════════
   SUB-PAGES
   ═══════════════════════════════ */
.pg{padding:16px 20px}
.pg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:12px}
.pg-sec{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pg-sec .t{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-weight:600}
.pcard{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;transition:border-color .2s}
.pcard:hover{border-color:var(--line2)}
.pcard .k{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.pcard .v{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1}
.pcard .s{font-size:9px;color:var(--muted);margin-top:3px}
.tag{font-size:8px;padding:2px 6px;border-radius:99px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:3px}
.tag.ok{color:var(--ok);border-color:rgba(94,232,176,.18)}.tag.warn{color:var(--warn);border-color:rgba(240,192,80,.18)}.tag.crit{color:var(--crit);border-color:rgba(232,96,96,.18)}.tag.off{color:var(--dim)}
.it{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:11px}
.it:last-child{border-bottom:none}
.prog{height:3px;background:var(--bg);border-radius:99px;overflow:hidden;margin:4px 0}
.prog-f{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.empty{text-align:center;padding:16px;color:var(--dim);font-size:11px}

/* ═══════════════════════════════
   CHAT
   ═══════════════════════════════ */
.chat{
  flex-shrink:0;border-top:1px solid var(--line);background:var(--deep);
  display:flex;flex-direction:column;
}
.chat-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 16px;cursor:pointer;transition:background .15s;
}
.chat-h:hover{background:var(--glass)}
.chat-h .t{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600}
.chat-h .a{font-size:9px;color:var(--dim);transition:transform .25s}
.chat-b{height:0;overflow:hidden;transition:height .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.chat-b.open{height:320px}
.chat-msgs{flex:1;overflow-y:auto;padding:6px 16px;display:flex;flex-direction:column;gap:4px}
.m{max-width:72%;padding:6px 10px;border-radius:10px;font-size:11px;line-height:1.5;white-space:pre-wrap}
.m.user{align-self:flex-end;background:rgba(139,108,199,.07);border:1px solid rgba(139,108,199,.15)}
.m.brain{align-self:flex-start;background:var(--glass);border:1px solid var(--line)}
.m .w{font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.m .ts{font-size:7px;color:var(--dim);margin-top:2px;opacity:.6}
.typing{align-self:flex-start;font-size:11px;color:var(--dim);padding:6px 10px;display:flex;gap:3px;align-items:center}
.typing-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);animation:typing-bounce 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typing-bounce{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-4px);opacity:1}}
.chat-q{display:flex;gap:3px;padding:0 16px 5px;overflow-x:auto}
.qb{font-size:8px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--dim);white-space:nowrap;flex-shrink:0;transition:all .15s}
.qb:hover{color:var(--text);border-color:var(--line2)}
.chat-in{display:flex;gap:5px;padding:6px 16px;border-top:1px solid var(--line)}
.chat-in input{flex:1;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:11px;outline:none;transition:border-color .2s}
.chat-in input:focus{border-color:var(--accent)}
.chat-in button{
  background:var(--accent);color:#0a0612;border:none;border-radius:8px;

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n);
const lc={INFO:'i',NOTICE:'i',WARNING:'w',CRITICAL:'c',SECURITY:'c',OPPORTUNITY:'i',EVOLUTION:'e'};
const pn={home:'GOD · Home',intel:'GOD · Intelligence',mem:'GOD · Memory',comp:'GOD · Compute',tok:'GOD · Tokens',evo:'GOD · Evolution',act:'GOD · Activity',set:'GOD · Settings'};
let S=null,cLen=0,cOpen=false,flagsDone=false,coreSt='idle';

// ═══════════════════════════════
// MARKDOWN RENDERER (pure JS, no deps)
// ═══════════════════════════════
function highlight(code,lang){
  if(!lang)return esc(code);
  const L=lang.toLowerCase();
  // Escape first
  let h=esc(code);
  // Remove shebang
  h=h.replace(/^#!.*\n/,'');
  if(L==='py'||L==='python'){
    // Comments
    h=h.replace(/(#[^\n]*)/g,'<span class="syn-c">$1</span>');
    // Strings (triple-quoted, single, double)
    h=h.replace(/("""[\s\S]*?"""|'''[\s\S]*?''')/g,'<span class="syn-s">$1</span>');
    h=h.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,'<span class="syn-s">$1</span>');
    // Keywords
    h=h.replace(/\b(def|class|if|elif|else|for|while|return|import|from|as|try|except|finally|with|yield|async|await|raise|pass|break|continue|and|or|not|in|is|lambda|None|True|False|self|global|nonlocal)\b/g,'<span class="syn-k">$1</span>');
    // Decorators
    h=h.replace(/(@\w+)/g,'<span class="syn-d">$1</span>');
    // Numbers
    h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="syn-n">$1</span>');
    // Builtins
    h=h.replace(/\b(print|len|range|int|str|float|list|dict|set|tuple|type|isinstance|hasattr|getattr|setattr|super|enumerate|zip|map|filter|sorted|reversed|min|max|sum|abs|any|all|open|input|id)\b(?=\s*\()/g,'<span class="syn-b">$1</span>');
  }else if(L==='js'||L==='javascript'||L==='ts'||L==='typescript'){
    // Comments
    h=h.replace(/(\/\/[^\n]*)/g,'<span class="syn-c">$1</span>');
    h=h.replace(/(\/\*[\s\S]*?\*\/)/g,'<span class="syn-c">$1</span>');
    // Strings
    h=h.replace(/(`(?:[^`\\]|\\.)*`)/g,'<span class="syn-s">$1</span>');
    h=h.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,'<span class="syn-s">$1</span>');
    // Keywords
    h=h.replace(/\b(const|let|var|function|class|if|else|for|while|do|switch|case|break|continue|return|import|from|export|default|try|catch|finally|throw|new|typeof|instanceof|void|delete|in|of|async|await|yield|null|undefined|true|false|this|super|extends|static|get|set)\b/g,'<span class="syn-k">$1</span>');
    // TypeScript types
    if(L==='ts'||L==='typescript'){
      h=h.replace(/\b(string|number|boolean|any|void|never|unknown|object|interface|type|enum|namespace|abstract|implements|readonly|private|protected|public|as|is|keyof|infer)\b/g,'<span class="syn-t">$1</span>');
    }
    // Numbers
    h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="syn-n">$1</span>');
    // Builtins
    h=h.replace(/\b(console|document|window|fetch|setTimeout|setInterval|clearTimeout|clearInterval|Promise|Array|Object|Map|Set|JSON|Math|Date|RegExp|Error|Symbol|BigInt|parseInt|parseFloat|require|module|process|globalThis)\b(?!\s*:)/g,'<span class="syn-b">$1</span>');
  }else if(L==='json'){
    // Keys
    h=h.replace(/("[\w]+")\s*:/g,'<span class="syn-f">$1</span>:');
    // Strings
    h=h.replace(/:\s*("(?:[^"\\]|\\.)*")/g,': <span class="syn-s">$1</span>');
    // Numbers
    h=h.replace(/:\s*(\d+\.?\d*)/g,': <span class="syn-n">$1</span>');
    // Booleans/null
    h=h.replace(/:\s*(true|false|null)\b/g,': <span class="syn-k">$1</span>');
  }else if(L==='bash'||L==='sh'||L==='shell'||L==='zsh'){
    // Comments
    h=h.replace(/(#[^\n]*)/g,'<span class="syn-c">$1</span>');
    // Strings
    h=h.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,'<span class="syn-s">$1</span>');
    // Keywords
    h=h.replace(/\b(if|then|else|elif|fi|for|while|do|done|case|esac|function|return|in|select|until|local|export|source|alias|unalias|cd|ls|grep|awk|sed|cat|echo|printf|read|test|exit|set|unset|shift|eval|exec|trap|kill|wait|sleep|mkdir|rmdir|rm|cp|mv|chmod|chown|sudo|apt|pip|npm|git|docker|curl|wget)\b/g,'<span class="syn-k">$1</span>');
    // Variables
    h=h.replace(/(\$\w+|\$\{[^}]+\})/g,'<span class="syn-t">$1</span>');
    // Numbers
    h=h.replace(/\b(\d+)\b/g,'<span class="syn-n">$1</span>');
  }else if(L==='html'||L==='xml'){
    // Tags
    h=h.replace(/(&lt;\/?)([\w-]+)/g,'$1<span class="syn-k">$2</span>');
    // Attributes
    h=h.replace(/([\w-]+)(=)/g,'<span class="syn-f">$1</span>$2');
    // Strings
    h=h.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,'<span class="syn-s">$1</span>');
    // Comments
    h=h.replace(/(&lt;!--[\s\S]*?--&gt;)/g,'<span class="syn-c">$1</span>');
  }else if(L==='css'){
    // Properties
    h=h.replace(/([\w-]+)\s*:/g,'<span class="syn-f">$1</span>:');
    // Values
    h=h.replace(/:\s*([^;}\n]+)/g,': <span class="syn-s">$1</span>');
    // Selectors (simplified)
    h=h.replace(/([.#][\w-]+)/g,'<span class="syn-k">$1</span>');
    // Comments
    h=h.replace(/(\/\*[\s\S]*?\*\/)/g,'<span class="syn-c">$1</span>');
  }else if(L==='sql'){
    // Keywords
    h=h.replace(/\b(SELECT|FROM|WHERE|AND|OR|NOT|IN|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|DROP|ALTER|TABLE|INDEX|VIEW|JOIN|LEFT|RIGHT|INNER|OUTER|ON|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|UNION|ALL|DISTINCT|AS|IS|NULL|TRUE|FALSE|LIKE|BETWEEN|EXISTS|CASE|WHEN|THEN|ELSE|END|COUNT|SUM|AVG|MIN|MAX|PRIMARY|KEY|FOREIGN|REFERENCES|CONSTRAINT|DEFAULT|AUTO_INCREMENT|SERIAL|VARCHAR|INTEGER|TEXT|BOOLEAN|TIMESTAMP|DATE|FLOAT|REAL|BIGINT|SMALLINT)\b/gi,'<span class="syn-k">$1</span>');
    // Strings
    h=h.replace(/('(?:[^'\\]|\\.)*')/g,'<span class="syn-s">$1</span>');
    // Numbers
    h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="syn-n">$1</span>');
  }
  return h;
}

function renderMd(text){
  if(!text)return'';
  // Escape HTML
  let h=esc(text);
  // Code blocks: ```lang\n...\n```
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(m,lang,code)=>{
    const highlighted=highlight(decodeHtml(code),lang);
    const langLabel=lang||'code';
    return`<div class="code-wrap"><div class="code-header"><span class="code-lang">${langLabel}</span><button class="code-copy" onclick="copyCode(this)">Copiar</button></div><code class="code-block">${highlighted}</code></div>`;
  });
  // Inline code: `...`
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  // Headers
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  // Bold
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  // Italic
  h=h.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'<em>$1</em>');
  // Blockquotes
  h=h.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  // Unordered lists
  h=h.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>');
  // Ordered lists
  h=h.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  // Wrap consecutive <li> in <ul>
  h=h.replace(/((?:<li>.*<\/li>\s*)+)/g,'<ul>$1</ul>');
  // Links
  h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  // Horizontal rule
  h=h.replace(/^---$/gm,'<hr style="border:none;border-top:1px solid var(--line);margin:4px 0">');
  // Tables (basic)
  h=h.replace(/^\|(.+)\|$/gm,(m,content)=>{
    const cells=content.split('|').map(c=>c.trim());
    const isSep=cells.every(c=>/^[-:]+$/.test(c));
    if(isSep)return'';
    const tag=cells.some(c=>/^[:]/.test(c))?'th':'td';
    const row=cells.map(c=>`<${tag}>${c.replace(/^:|:$/g,'')}</${tag}>`).join('');
    return`<tr>${row}</tr>`;
  });
  h=h.replace(/((?:<tr>[\s\S]*?<\/tr>\s*)+)/g,'<table>$1</table>');
  // Paragraphs (double newline)
  h=h.replace(/\n\n/g,'</p><p>');
  // Single newlines (but not inside code blocks)
  h=h.replace(/\n/g,'<br>');
  return h;
}

function decodeHtml(html){
  return html.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
}

function copyCode(btn){
  const code=btn.closest('.code-wrap').querySelector('.code-block');
  const text=code.textContent;
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='Copiado ✓';
    setTimeout(()=>{btn.textContent='Copiar';},1500);
  }).catch(()=>{
    // Fallback
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    btn.textContent='Copiado ✓';
    setTimeout(()=>{btn.textContent='Copiar';},1500);
  });
}

const QA=[{l:'Estado',q:'estado'},{l:'Missão',q:'missão actual'},{l:'Roadmap',q:'roadmap'},{l:'Tokens',q:'economia de tokens'},{l:'Benchmark',q:'corre benchmark'}];

// GOD CORE state with personality messages
function setCore(st,label){
  coreSt=st;
  const orb=$('core-orb');
  orb.dataset.state=st;
  const breathing={idle:'slow',ready:'ready',listening:'active',thinking:'active',tools:'active',responding:'fast',error:'active',offline:'slow'};
  orb.dataset.breathing=breathing[st]||'slow';
  
  // Personality messages if no custom label
  if(!label){
    const msgs={
      idle:'Em repouso',
      ready:'Pronta',
      listening:'A ouvir...',
      thinking:'A analisar...',
      tools:'A usar ferramentas...',
      responding:'A responder...',
      error:'Atenção necessária',
      offline:'Offline'
    };
    label=msgs[st]||st;
  }
  $('core-st').textContent=label;
  
  // Status color
  const colors={idle:'var(--dim)',ready:'var(--accent)',listening:'var(--info)',thinking:'var(--accent)',tools:'var(--evo)',responding:'var(--ok)',error:'var(--crit)',offline:'var(--dim)'};
  $('core-st').style.color=colors[st]||'var(--dim)';
}

// ═══ PAINT ═══
function paint(s){
  S=s;pStatus(s);pCore(s);pKPI(s);pSmap(s);pNodes(s);pFeed(s);pPerf(s);
  pIntel(s);pMem(s);pComp(s);pTok(s);pEvo(s);pAct(s);pCfg(s);pProf(s);pChat(s);
}

function pStatus(s){
  const llm=(s.providers||[]).some(p=>p.available);
  const al=(s.eye&&s.eye.alerts)||[];
  const cr=al.some(a=>a.level==='CRITICAL'||a.level==='SECURITY');
  let c='ok',l='Healthy';
  if(!llm){c='crit';l='No LLM';}else if(cr){c='crit';l='Critical';}else if(al.length){c='warn';l=al.length+' Alert';}
  $('h-sys').className='h-badge '+c;$('h-sys-t').textContent=l;
  // Voice badge — distinguish TTS/STT
  const vb=$('h-voice');
  if(s.voice_ready){
    vb.classList.add('ok');
    vb.innerHTML='<div class="h-dot"></div> TTS · Ready';
  }else{
    vb.classList.remove('ok');
    vb.innerHTML='<div class="h-dot"></div> TTS';
  }
}

function pCore(s){
  const llm=(s.providers||[]).some(p=>p.available);
  const al=(s.eye&&s.eye.alerts)||[];
  const cr=al.some(a=>a.level==='CRITICAL'||a.level==='SECURITY');
  if(!llm&&!s.mode){setCore('offline','Offline');return;}
  if(cr){setCore('error','Atenção necessária');return;}
  if(coreSt==='thinking'||coreSt==='listening'||coreSt==='tools'||coreSt==='responding')return;
  setCore('ready','Pronta');
}

function pKPI(s){
  const h=s.host||{},u=s.usage||{},c=s.cache||{};
  const llm=(s.providers||[]).some(p=>p.available);
  const lp=s.last_pipeline||{};
  const td=s.token||{},ms=(td.models||{}).models||[],top=ms[0];
  const mem=s.memory||{};
  let hp=0;if(llm)hp+=40;if(h.load1&&h.cpu_count)hp+=Math.max(0,30-(h.load1/h.cpu_count*30));if(c.hit_rate!=null)hp+=Math.round(c.hit_rate*30);
  $('kpis').innerHTML=`
    <div class="kpi"><div class="k">Health</div><div class="v" style="color:${hp>70?'var(--ok)':hp>40?'var(--warn)':'var(--crit)'}">${hp}%</div></div>
    <div class="kpi"><div class="k">AI</div><div class="v" style="font-size:12px">${top?esc(top.model.split('/').pop()):'—'}</div><div class="s">${top?esc(top.provider||''):'Not connected'}</div></div>
    <div class="kpi"><div class="k">Response</div><div class="v">${lp.latency_ms!=null?lp.latency_ms+'ms':'—'}</div><div id="sparkline-container"></div><div class="s">${lp.latency_ms!=null?'Last request':'No data'}</div></div>
    <div class="kpi"><div class="k">Memory</div><div class="v">${fmtN(mem.total||0)}</div></div>
    <div class="kpi"><div class="k">Tokens</div><div class="v">${fmtN(u.session_tokens||0)}</div></div>
    <div class="kpi"><div class="k">CPU</div><div class="v">${h.load1&&h.cpu_count?Math.round(h.load1/h.cpu_count*100)+'%':'—'}</div></div>
  `;
}

function pSmap(s){
  const llm=(s.providers||[]).some(p=>p.available);
  const qd=s.qdrant||{},os=s.os||{},q=s.queue||{};
  const gov=s.governor||{};
  const nodes=[
    {n:'AI Core',on:llm,v:llm?'Online':'Offline',det:'Providers: '+(s.providers||[]).filter(p=>p.available).length+'/'+(s.providers||[]).length,caps:['llm','routing']},
    {n:'Memory',on:qd.available,v:qd.available?'Qdrant':'SQLite',det:'Embed: '+(qd.embed?qd.embed.method:'Hashing'),caps:['storage','semantic']},
    {n:'Compute',on:true,v:'Active',det:'CPU: '+(s.host&&s.host.cpu_count||'?')+' cores',caps:['cpu','worker']},
    {n:'Governor',on:gov.strict!=null,v:gov.strict?'Strict':'Lax',det:'Mode: '+(gov.resource_mode||'NORMAL'),caps:['control']},
    {n:'OS',on:os.booted,v:os.booted?'Booted':'Offline',det:'Uptime: '+(os.uptime_s?Math.floor(os.uptime_s/60)+'min':'?'),caps:['system']},
    {n:'Queue',on:true,v:(q.queued||0)+' pending',det:'Running: '+(q.running||0),caps:['async']},
  ];
  // List view with click handlers
  $('smap').innerHTML=nodes.map(x=>`<div class="sr" data-node="${x.n}"><div class="sd ${x.on?'on':'off'}"></div><div class="sn">${x.n}</div><div class="sv">${x.v}</div></div>`).join('');
  // Click handlers for node details
  document.querySelectorAll('.sr[data-node]').forEach(el=>{
    el.addEventListener('click',()=>{
      const name=el.dataset.node;
      const node=nodes.find(n=>n.n===name);
      if(!node)return;
      const existing=document.querySelector('.smap-detail');
      if(existing)existing.remove();
      const detail=document.createElement('div');
      detail.className='smap-detail show';
      detail.innerHTML=`<div class="dt">${node.n}</div><div class="dd"><strong>${node.v}</strong><br>${node.det}<div class="dc">${node.caps.map(c=>`<span>${c}</span>`).join('')}</div></div>`;
      el.parentElement.appendChild(detail);
      const close=e=>{if(!detail.contains(e.target)&&!el.contains(e.target)){detail.remove();document.removeEventListener('click',close);}};
      setTimeout(()=>document.addEventListener('click',close),100);
    });
  });
}

function pFeed(s){
  const ev=(s.events||[]).slice(0,12);
  $('feed').innerHTML=ev.length?ev.map(e=>`<div class="fr"><div class="ft">${new Date(e.ts).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div><div class="fd ${lc[e.level]||'i'}"></div><div class="fm">${esc(e.msg||e.name)}</div></div>`).join(''):'<div class="empty">Sem actividade</div>';
}

function pNodes(s){
  const nodes=s.nodes||{};
  const list=nodes.nodes||[];
  if(!list.length){$('nodes').innerHTML='<div class="empty">Nenhum node registado</div>';return;}
  $('nodes').innerHTML=list.map(n=>{
    const caps=(n.capabilities||[]).map(c=>`<span style="font-size:8px;padding:1px 4px;background:var(--glass);border:1px solid var(--line);border-radius:4px;margin-right:3px">${esc(c)}</span>`).join('');
    return `<div style="padding:6px 0;border-bottom:1px solid var(--line)">

        <div style="font-weight:500;font-size:11px">${esc(n.name)}</div>
        <span class="tag ${n.status==='online'?'ok':'off'}">${esc(n.status)}</span>
      </div>
      <div style="margin-top:3px">${caps}</div>
      <div style="font-size:9px;color:var(--dim);margin-top:2px">${esc(n.location)} · ${esc(n.id)}</div>
    </div>`;
  }).join('');
}

function pProviders(s){
  const ps=s.providers||[];
  if(!ps.length){$('providers').innerHTML='<div class="empty">Sem providers</div>';return;}
  $('providers').innerHTML=ps.map(p=>`<div class="pv"><div class="pv-d ${p.available?'up':'down'}"></div><div class="pv-n">${esc(p.name)}</div><div class="pv-m">${(p.models||[]).slice(0,2).join(', ')}</div><span class="tag ${p.available?'ok':'off'}">${p.available?'Up':'Down'}</span></div>`).join('');
}

function pPerf(s){
  const perf=s.perf||{};
  const stats=perf.stats||{};
  const history=perf.history||[];
  const cache=s.cache||{};
  const usage=s.usage||{};
  
  if(!$('perf-panel'))return;
  
  // Build sparkline SVG
  let sparkline='';
  if(history.length>1){
    const w=100,h=20;
    const vals=history.map(d=>d.latency_ms||0).reverse();
    const mx=Math.max(...vals,1);
    const pts=vals.map((v,i)=>{
      const x=(i/(vals.length-1))*w;
      const y=h-(v/mx)*h;
      return `${x},${y}`;
    }).join(' ');
    sparkline=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;margin:4px 0"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  
  $('perf-panel').innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <div style="flex:1;text-align:center;padding:4px">
        <div style="font-size:8px;color:var(--dim)">Requests</div>
        <div style="font-family:var(--mono);font-size:14px">${stats.n||0}</div>
      </div>
      <div style="flex:1;text-align:center;padding:4px">
        <div style="font-size:8px;color:var(--dim)">Avg Latency</div>
        <div style="font-family:var(--mono);font-size:14px;color:var(--ok)">${stats.avg_ms||'—'}ms</div>
      </div>
      <div style="flex:1;text-align:center;padding:4px">
        <div style="font-size:8px;color:var(--dim)">Cache Hit</div>
        <div style="font-family:var(--mono);font-size:14px;color:var(--accent)">${cache.hit_rate!=null?Math.round(cache.hit_rate*100)+'%':'—'}</div>
      </div>
    </div>
    ${sparkline}
    <div style="font-size:9px;color:var(--dim)">LLM: ${usage.llm_calls||0} calls · Tools: ${usage.tool_calls||0} calls · Tokens: ${fmtN(usage.session_tokens||0)}</div>
  `;
}

function pMem(s){
  const m=s.memory||{},c=s.cache||{},qd=s.qdrant||{};
  const tot=(m.session||0)+(m.semantic||0)+(m.project||0);
  $('m-kpis').innerHTML=`

  `;
  $('m-det').innerHTML=`<div style="font-size:10px;color:var(--muted);line-height:1.8">Qdrant: ${qd.available?'Connected':'Offline'} · ${qd.embed?qd.embed.method:'HashingVectorizer'}<br>Cache: ${c.hits||0} hits · ${c.misses||0} misses · ${c.entries||0} entries<br>Projects: ${m.project||0}</div>`;
}

function pComp(s){
  const h=s.host||{},ws=s.workers||[];
  const cpu=h.load1&&h.cpu_count?Math.round(h.load1/h.cpu_count*100):null;
  const ram=h.ram_avail_mb?(h.ram_avail_mb/1024).toFixed(1):null;
  const ramT=h.ram_total_mb?(h.ram_total_mb/1024).toFixed(1):null;
  const ramP=ramT&&ram?Math.round((1-ram/ramT)*100):null;
  $('c-kpis').innerHTML=`
    <div class="pcard"><div class="k">CPU</div><div class="v" style="color:${cpu>80?'var(--crit)':cpu>60?'var(--warn)':'var(--ok)'}">${cpu!=null?cpu+'%':'—'}</div></div>
    <div class="pcard"><div class="k">RAM</div><div class="v" style="color:var(--info)">${ramP!=null?ramP+'%':'—'}</div><div class="s">${ram?ram+'GB free':''}</div></div>
    <div class="pcard"><div class="k">GPU</div><div class="v" style="font-size:13px;color:var(--dim)">${h.gpu&&h.gpu.present?'Yes':'N/A'}</div></div>
    <div class="pcard"><div class="k">Workers</div><div class="v" style="color:var(--accent)">${ws.length}</div></div>
  `;
  $('c-res').innerHTML=`
    <div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted)"><span>CPU</span><span>${cpu!=null?cpu+'%':'—'}</span></div><div class="prog"><div class="prog-f" style="width:${cpu||0}%;background:${cpu>80?'var(--crit)':cpu>60?'var(--warn)':'var(--ok)'}"></div></div><div style="font-size:9px;color:var(--dim)">${h.cpu_count||'?'} cores · load ${h.load1||'?'}</div></div>
    <div style="margin-top:6px"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted)"><span>RAM</span><span>${ram?ram+'GB free':'—'}${ramT?' / '+ramT+'GB':''}</span></div><div class="prog"><div class="prog-f" style="width:${ramP||0}%;background:var(--info)"></div></div></div>
  `;
  $('c-wrk').innerHTML=ws.length?ws.map(w=>`<div class="it"><div><span style="font-weight:500">${esc(w.id)}</span> <span style="font-size:9px;color:var(--dim)">${esc(w.location)}</span></div><span class="tag ${w.alive?'ok':'off'}">${w.alive?'Alive':'Dead'}</span></div>`).join(''):'<div class="empty">Nenhum worker remoto</div>';
}

}

function pAct(s){
  const ev=s.events||[];
  $('a-feed').innerHTML=ev.length?ev.map(e=>`<div class="fr"><div class="ft">${new Date(e.ts).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div><div class="fd ${lc[e.level]||'i'}"></div><div class="fm" style="white-space:normal"><div>${esc(e.name)}</div><div style="font-size:9px;color:var(--dim)">${esc(e.msg)}</div></div></div>`).join(''):'<div class="empty">Sem eventos</div>';
}

function loadFlags(){
  flagsDone=true;
  fetch('/api/system/flags').then(r=>r.json()).then(f=>{
    const en=f.enabled||[],dis=f.disabled||[],hi=f.high_risk||[];
    $('s-flags').innerHTML=`
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <div style="flex:1;padding:6px;background:var(--ok-dim);border:1px solid rgba(94,232,176,.12);border-radius:7px;text-align:center"><div style="font-size:8px;color:var(--dim)">Enabled</div><div style="font-family:var(--mono);font-size:16px;color:var(--ok)">${en.length}</div></div>
        <div style="flex:1;padding:6px;background:var(--glass);border:1px solid var(--line);border-radius:7px;text-align:center"><div style="font-size:8px;color:var(--dim)">Disabled</div><div style="font-family:var(--mono);font-size:16px">${dis.length}</div></div>
        <div style="flex:1;padding:6px;background:var(--crit-dim);border:1px solid rgba(232,96,96,.12);border-radius:7px;text-align:center"><div style="font-size:8px;color:var(--dim)">High Risk</div><div style="font-family:var(--mono);font-size:16px;color:var(--crit)">${hi.length}</div></div>
      </div>
      ${[...en.map(n=>({n,on:true})),...dis.map(n=>({n,on:false}))].map(x=>`<div class="it"><span style="font-size:10px">${esc(x.n)}</span><span class="tag ${x.on?'ok':'off'}" style="font-size:7px">${x.on?'ON':'OFF'}</span></div>`).join('')}
    `;
  }).catch(()=>{$('s-flags').innerHTML='<div class="empty">Falhou</div>';});
}

function pProf(s){
  const g=s.god||{},act=g.active||{},profs=g.profiles||[];
  $('s-prof').innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <div style="flex:1;padding:6px;background:var(--glow);border:1px solid rgba(139,108,199,.12);border-radius:7px;text-align:center"><div style="font-size:8px;color:var(--dim)">Profiles</div><div style="font-family:var(--mono);font-size:16px;color:var(--accent)">${profs.length}</div></div>
    </div>
    <div style="margin-bottom:6px"><div style="font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px">Activo</div><div style="font-weight:500;font-size:11px">${esc(act.name||'Default')}</div><div style="font-size:10px;color:var(--muted)">${esc((act.purpose||'').slice(0,70))}</div></div>
    ${profs.filter(p=>p.id!==act.id).slice(0,3).map(p=>`<div class="it"><div style="font-weight:500">${esc(p.name)}</div></div>`).join('')}
  `;
}

function pChat(s){
  const msgs=s.chat||[];
  if(msgs.length===cLen&&$('chat-m').children.length)return;
  cLen=msgs.length;
  $('chat-m').innerHTML=msgs.map(m=>{
    const ts=m.ts?new Date(m.ts).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}):'';
    const content=m.role==='brain'?renderMd(m.text):esc(m.text);
    return `<div class="m ${m.role}"><div class="w">${m.role==='brain'?'GOD':'You'}</div>${content}${ts?`<div class="ts">${ts}</div>`:''}</div>`;
  }).join('')+'<div class="typing" id="typing-indicator" style="display:none"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  $('chat-m').scrollTop=$('chat-m').scrollHeight;
  if(msgs.length&&!cOpen){cOpen=true;$('chat-b').classList.add('open');$('chat-a').style.transform='rotate(180deg)';}
}

// ═══ SSE ═══
let perfData = { history: [], stats: {} };

function connect(){
  const es=new EventSource('/api/stream');
  es.addEventListener('snapshot',e=>{
    try{
      const d=JSON.parse(e.data);
      paint(d);
      // Update perf data
      if(d.perf){
        perfData = d.perf;
        updatePerfDisplay();
      }
    }catch(err){console.error(err);}
  });
  
  // Listen for GOD CORE state events
  es.addEventListener('event',e=>{
    try{
      const ev=JSON.parse(e.data);
      if(ev.god_core_state){
        if(coreSt==='error' && ev.god_core_state!=='error' && ev.god_core_state!=='offline') return;
        setCore(ev.god_core_state, ev.msg);
        // Show/hide typing indicator
        const ti=$('typing-indicator');
        if(ti){
          ti.style.display=['thinking','tools','responding'].includes(ev.god_core_state)?'flex':'none';
          if(ev.god_core_state==='thinking'||ev.god_core_state==='tools') $('chat-m').scrollTop=$('chat-m').scrollHeight;
        }
        if(ev.god_core_state==='responding'||ev.god_core_state==='ready'){
          clearTimeout(window._coreReturnTimer);
          window._coreReturnTimer=setTimeout(()=>{setCore('ready','Pronta');if(ti)ti.style.display='none';},3000);
        }
      }
    }catch(err){}
  });
  
  es.onerror=()=>{es.close();setTimeout(connect,2000);fetch('/api/state').then(r=>r.json()).then(paint).catch(()=>{});};
}
fetch('/api/state').then(r=>r.json()).then(d=>{
  paint(d);
  if(d.perf) perfData=d.perf;
}).catch(()=>{
  $('h-sys').className='h-badge crit';$('h-sys-t').textContent='Offline';setCore('offline','Offline');
});
connect();

// Performance display with sparkline
function updatePerfDisplay(){
  const stats=perfData.stats||{};
  const history=perfData.history||[];
  if(stats.n>0){
    const kpis=document.querySelectorAll('.kpi');
    if(kpis[2]){
      const v=kpis[2].querySelector('.v');
      const s=kpis[2].querySelector('.s');
      if(v && stats.avg_ms) v.textContent=stats.avg_ms+'ms';
      if(s) s.textContent=`${stats.n} req · min ${stats.min_ms}ms · max ${stats.max_ms}ms`;
    }
  }
  if(history.length>1){
    const container=$('sparkline-container');
    if(container){
      const svg=drawSparkline(history);
      container.innerHTML=svg;
    }
  }
}

function drawSparkline(data){
  const w=120,h=24;
  const values=data.map(d=>d.latency_ms||0).reverse();
  const max=Math.max(...values,1);
  const points=values.map((v,i)=>{
    const x=(i/(values.length-1))*w;
    const y=h-(v/max)*h;
    return `${x},${y}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;margin:4px auto 0"><polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
