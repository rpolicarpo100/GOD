<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>GOD — Living Intelligence</title>
<style>
:root {
  --bg: #050608;
  --bg2: #0a0c10;
  --bg3: #0f1118;
  --bg4: #161922;
  --surface: rgba(255,255,255,.025);
  --line: rgba(200,195,220,.07);
  --line2: rgba(200,195,220,.14);
  --text: #e8e4f0;
  --muted: #8a8598;
  --dim: #55506a;
  --accent: #c4a0e8;
  --accent2: #9d7cd8;
  --ok: #6ee7b7;
  --warn: #fbbf24;
  --crit: #f87171;
  --info: #7dd3fc;
  --evo: #c4b5fd;
  --mono: 'SF Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
  --sans: -apple-system, 'Segoe UI', system-ui, sans-serif;
  --glow: rgba(157,124,216,.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px;
  display: flex; flex-direction: column; overflow: hidden;
}
button, input, textarea, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 9px; }

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
}

/* ══════════════════════════════════════
   LAYOUT
   ══════════════════════════════════════ */
.shell { display: flex; height: 100%; min-height: 0; }

/* ── Sidebar ── */
.sidebar {
  width: 56px; flex-shrink: 0; display: flex; flex-direction: column;
  background: var(--bg2); border-right: 1px solid var(--line);
  align-items: center; padding: 12px 0; gap: 4px; z-index: 50;
}
.nav-btn {
  width: 40px; height: 40px; border-radius: 10px; border: none;
  background: transparent; color: var(--muted); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; position: relative;
}
.nav-btn:hover { color: var(--text); background: var(--surface); }
.nav-btn.active { color: var(--accent); background: rgba(157,124,216,.1); }
.nav-btn.active::before {
  content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--accent);
}
.nav-spacer { flex: 1; }

/* ── Content ── */
.content { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* ── Topbar ── */
.topbar {
  height: 42px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--bg2); flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-title { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.sys-badge {
  display: flex; align-items: center; gap: 5px; font-size: 10px; letter-spacing: .08em;
  text-transform: uppercase; padding: 3px 10px; border-radius: 99px;
  border: 1px solid var(--line); color: var(--muted);
}
.sys-badge.ok { color: var(--ok); border-color: rgba(110,231,183,.25); }
.sys-badge.warn { color: var(--warn); border-color: rgba(251,191,36,.25); }
.sys-badge.crit { color: var(--crit); border-color: rgba(248,113,113,.25); }
.clock { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: .05em; }

/* ── Pages ── */
.page { flex: 1; overflow-y: auto; display: none; }
.page.active { display: flex; flex-direction: column; }

/* ══════════════════════════════════════
   HOME PAGE — GOD CORE
   ══════════════════════════════════════ */
.home { align-items: center; padding: 24px 20px; }

/* GOD CORE */
.god-core {
  display: flex; flex-direction: column; align-items: center;
  padding: 32px 0 20px; flex-shrink: 0;
}
.core-ring {
  width: 160px; height: 160px; position: relative;
  display: flex; align-items: center; justify-content: center;
}
.core-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.core-ring .ring-outer {
  fill: none; stroke: var(--line2); stroke-width: 1;
}
.core-ring .ring-inner {
  fill: none; stroke: var(--accent); stroke-width: 1.5;
  stroke-dasharray: 280; stroke-dashoffset: 280;
  transition: stroke-dashoffset 1s ease, stroke .5s;
}
.core-ring .ring-pulse {
  fill: none; stroke: var(--accent); stroke-width: .5; opacity: 0;
  transition: opacity .5s;
}
.core-center {
  width: 64px; height: 64px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, rgba(157,124,216,.15), rgba(157,124,216,.03));
  border: 1px solid var(--line2);
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 2;
  transition: all .5s;
}
.core-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 12px rgba(157,124,216,.4);
  transition: all .5s;
}
.core-label {
  margin-top: 14px; text-align: center;
}
.core-label .name {
  font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
  color: var(--accent); font-weight: 600;
}
.core-label .status {
  font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--muted); margin-top: 3px;
  transition: color .3s;
}

/* GOD CORE STATES */
.god-core[data-state="idle"] .ring-inner { stroke-dashoffset: 280; stroke: var(--dim); }
.god-core[data-state="idle"] .core-dot { background: var(--dim); box-shadow: 0 0 8px rgba(85,80,106,.3); animation: core-breathe 4s ease-in-out infinite; }

.god-core[data-state="ready"] .ring-inner { stroke-dashoffset: 0; stroke: var(--accent); }
.god-core[data-state="ready"] .core-dot { animation: core-breathe 3s ease-in-out infinite; }

.god-core[data-state="listening"] .ring-inner { stroke-dashoffset: 140; stroke: var(--info); }
.god-core[data-state="listening"] .core-dot { background: var(--info); box-shadow: 0 0 16px rgba(125,211,252,.4); animation: core-listen 1.5s ease-in-out infinite; }
.god-core[data-state="listening"] .core-label .status { color: var(--info); }

.god-core[data-state="thinking"] .ring-inner { stroke-dashoffset: 70; stroke: var(--accent); }
.god-core[data-state="thinking"] .core-dot { animation: core-think 1.2s linear infinite; }
.god-core[data-state="thinking"] .ring-pulse { opacity: .3; animation: ring-pulse 2s ease-in-out infinite; }
.god-core[data-state="thinking"] .core-label .status { color: var(--accent); }

.god-core[data-state="tools"] .ring-inner { stroke-dashoffset: 100; stroke: var(--evo); }
.god-core[data-state="tools"] .core-dot { background: var(--evo); box-shadow: 0 0 14px rgba(196,181,253,.4); animation: core-think 1.5s linear infinite; }
.god-core[data-state="tools"] .core-label .status { color: var(--evo); }

.god-core[data-state="responding"] .ring-inner { stroke-dashoffset: 30; stroke: var(--ok); }
.god-core[data-state="responding"] .core-dot { background: var(--ok); box-shadow: 0 0 14px rgba(110,231,183,.4); animation: core-respond .8s ease-in-out infinite; }
.god-core[data-state="responding"] .core-label .status { color: var(--ok); }

.god-core[data-state="error"] .ring-inner { stroke-dashoffset: 200; stroke: var(--crit); }
.god-core[data-state="error"] .core-dot { background: var(--crit); box-shadow: 0 0 16px rgba(248,113,113,.4); }
.god-core[data-state="error"] .core-label .status { color: var(--crit); }

.god-core[data-state="offline"] .ring-inner { stroke-dashoffset: 280; stroke: var(--dim); opacity: .3; }
.god-core[data-state="offline"] .core-dot { background: var(--dim); box-shadow: none; opacity: .3; }
.god-core[data-state="offline"] .core-label .status { color: var(--dim); }

@keyframes core-breathe {
  0%, 100% { opacity: .6; transform: scale(.95); }
  50% { opacity: 1; transform: scale(1.05); }
}
@keyframes core-listen {
  0%, 100% { transform: scale(1); opacity: .7; }
  50% { transform: scale(1.3); opacity: 1; }
}
@keyframes core-think {
  0% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.15) rotate(180deg); }
  100% { transform: scale(1) rotate(360deg); }
}
@keyframes core-respond {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .7; transform: scale(.9); }
}
@keyframes ring-pulse {
  0%, 100% { r: 74; opacity: 0; }
  50% { r: 80; opacity: .3; }
}

/* ── KPI Strip ── */
.kpi-strip {
  display: flex; gap: 10px; width: 100%; max-width: 700px; margin: 16px 0;
  flex-wrap: wrap; justify-content: center;
}
.kpi {
  flex: 1; min-width: 100px; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  text-align: center; transition: border-color .2s;
}
.kpi:hover { border-color: var(--line2); }
.kpi .label { font-size: 9px; letter-spacing: .15em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
.kpi .value { font-family: var(--mono); font-size: 18px; font-weight: 600; }
.kpi .sub { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* ── Two columns ── */
.home-cols {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  width: 100%; max-width: 900px; flex: 1; min-height: 0;
}

/* ── Section ── */
.sec {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  display: flex; flex-direction: column; overflow: hidden;
}
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.sec-title { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.sec-body { flex: 1; overflow-y: auto; padding: 8px 12px; }

/* ── System Map ── */
.sysmap { display: flex; flex-direction: column; gap: 6px; }
.map-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.map-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.map-dot.on { background: var(--ok); box-shadow: 0 0 6px rgba(110,231,183,.3); }
.map-dot.off { background: var(--dim); }
.map-dot.warn { background: var(--warn); }
.map-name { width: 80px; color: var(--muted); font-size: 11px; }
.map-val { color: var(--text); font-family: var(--mono); font-size: 11px; }

/* ── Activity ── */
.feed { display: flex; flex-direction: column; gap: 4px; }
.feed-row { display: flex; gap: 8px; align-items: baseline; font-size: 11px; padding: 3px 0; }
.feed-ts { font-family: var(--mono); font-size: 9px; color: var(--dim); min-width: 48px; flex-shrink: 0; }
.feed-dot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.feed-msg { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-msg.info .feed-dot { background: var(--info); }
.feed-msg.warn .feed-dot { background: var(--warn); }
.feed-msg.crit .feed-dot { background: var(--crit); }
.feed-msg.ok .feed-dot { background: var(--ok); }
.feed-msg.evo .feed-dot { background: var(--evo); }

/* ── Providers ── */
.prov-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 11px; }
.prov-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.prov-dot.up { background: var(--ok); }
.prov-dot.down { background: var(--dim); }
.prov-name { color: var(--text); font-weight: 500; min-width: 70px; }
.prov-models { color: var(--dim); font-size: 10px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ══════════════════════════════════════
   OTHER PAGES
   ══════════════════════════════════════ */
.page-content { flex: 1; overflow-y: auto; padding: 16px 20px; }
.page-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 14px; }
.page-section {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; margin-bottom: 12px;
}
.page-section .title {
  font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent);
  margin-bottom: 10px; font-weight: 600;
}
.pcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px; text-align: center;
}
.pcard .label { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
.pcard .value { font-family: var(--mono); font-size: 20px; font-weight: 600; }
.pcard .sub { font-size: 10px; color: var(--muted); margin-top: 2px; }

.tag { font-size: 9px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 3px; }
.tag.ok { color: var(--ok); border-color: rgba(110,231,183,.25); }
.tag.warn { color: var(--warn); border-color: rgba(251,191,36,.25); }
.tag.crit { color: var(--crit); border-color: rgba(248,113,113,.25); }
.tag.off { color: var(--dim); }

.item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12px;
}
.item:last-child { border-bottom: none; }

.progress { height: 4px; background: var(--bg4); border-radius: 99px; overflow: hidden; margin: 5px 0; }
.progress-fill { height: 100%; border-radius: 99px; transition: width .5s ease; }

/* ── Chat ── */
.chat-area { flex-shrink: 0; border-top: 1px solid var(--line); background: var(--bg2); display: flex; flex-direction: column; }
.chat-toggle { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px; cursor: pointer; }
.chat-toggle .title { font-size: 9px; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.chat-toggle .arrow { font-size: 10px; color: var(--dim); transition: transform .2s; }
.chat-body { height: 0; overflow: hidden; transition: height .25s ease; display: flex; flex-direction: column; }
.chat-body.open { height: 200px; }
.chat-msgs { flex: 1; overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 5px; }
.msg { max-width: 75%; padding: 7px 11px; border-radius: 10px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: rgba(157,124,216,.08); border: 1px solid rgba(157,124,216,.2); }
.msg.brain { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); }
.msg .who { font-size: 8px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
.chat-input-row { display: flex; gap: 6px; padding: 8px 16px; border-top: 1px solid var(--line); }
.chat-input-row input {
  flex: 1; background: var(--bg3); border: 1px solid var(--line2); border-radius: 8px;
  padding: 8px 12px; font-size: 12px; outline: none;
}
.chat-input-row input:focus { border-color: var(--accent); }
.chat-send {
  background: var(--accent); color: #0a0612; border: none; border-radius: 8px;
  padding: 8px 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 10px;
}
.chat-quick { display: flex; gap: 4px; padding: 0 16px 6px; overflow-x: auto; }
.qbtn {
  font-size: 9px; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line);
  background: transparent; color: var(--dim); white-space: nowrap; flex-shrink: 0;
}
.qbtn:hover { color: var(--text); border-color: var(--line2); }

/* ── Voice badge ── */
.voice-badge {
  display: flex; align-items: center; gap: 5px; font-size: 9px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--dim); padding: 3px 8px;
  border: 1px solid var(--line); border-radius: 99px;
}
.voice-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--dim); }
.voice-badge.ready .dot { background: var(--ok); }
.voice-badge.ready { color: var(--ok); border-color: rgba(110,231,183,.2); }

/* ── Empty ── */
.empty { text-align: center; padding: 20px; color: var(--dim); font-size: 11px; }

/* ── Responsive ── */
@media (max-width: 700px) {
  .sidebar { width: 44px; }
  .nav-btn { width: 34px; height: 34px; font-size: 14px; }
  .home-cols { grid-template-columns: 1fr; }
  .kpi-strip { gap: 6px; }
  .kpi { min-width: 80px; padding: 8px; }
  .kpi .value { font-size: 15px; }
  .core-ring { width: 120px; height: 120px; }
  .core-center { width: 48px; height: 48px; }
  .core-dot { width: 8px; height: 8px; }
  .chat-body.open { height: 150px; }
}
</style>
</head>
<body>
<div class="shell">

  <!-- ═══ SIDEBAR ═══ -->
  <nav class="sidebar">
    <button class="nav-btn active" data-page="home" title="Home">◉</button>
    <button class="nav-btn" data-page="intel" title="Intelligence">◈</button>
    <button class="nav-btn" data-page="memory" title="Memory">▣</button>
    <button class="nav-btn" data-page="compute" title="Compute">⚡</button>
    <button class="nav-btn" data-page="tokens" title="Tokens">◌</button>
    <button class="nav-btn" data-page="evo" title="Evolution">↻</button>
    <button class="nav-btn" data-page="activity" title="Activity">▤</button>
    <div class="nav-spacer"></div>
    <button class="nav-btn" data-page="settings" title="Settings">⚙</button>
  </nav>

  <!-- ═══ CONTENT ═══ -->
  <div class="content">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="page-name">GOD · Home</div>
      </div>
      <div class="topbar-right">
        <div class="voice-badge" id="voice-badge"><div class="dot"></div> MIC</div>
        <div class="sys-badge" id="sys-badge"><div class="status-dot"></div> <span id="sys-label">Checking</span></div>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </header>

    <!-- ═══ HOME ═══ -->
    <div class="page active" id="page-home">

      <div class="home">
        <!-- GOD CORE -->
        <div class="god-core" id="god-core" data-state="idle">
          <div class="core-ring">
            <svg viewBox="0 0 160 160">
              <circle class="ring-outer" cx="80" cy="80" r="72"/>
              <circle class="ring-inner" cx="80" cy="80" r="72"/>
              <circle class="ring-pulse" cx="80" cy="80" r="74"/>
            </svg>
            <div class="core-center"><div class="core-dot"></div></div>
          </div>
          <div class="core-label">
            <div class="name">GOD</div>
            <div class="status" id="core-status">Initialising</div>
          </div>
        </div>

        <!-- KPI Strip -->
        <div class="kpi-strip" id="kpi-strip"></div>

        <!-- Two columns -->
        <div class="home-cols">
          <div class="sec">
            <div class="sec-head"><div class="sec-title">System Map</div></div>
            <div class="sec-body"><div class="sysmap" id="sysmap"></div></div>
          </div>
          <div class="sec">
            <div class="sec-head">
              <div class="sec-title">Activity</div>
              <div style="display:flex;align-items:center;gap:4px"><div class="map-dot on" style="animation:core-breathe 2s infinite"></div><span style="font-size:9px;color:var(--dim);letter-spacing:.08em">LIVE</span></div>
            </div>
            <div class="sec-body"><div class="feed" id="feed"></div></div>
          </div>
        </div>
      </div>

    </div>

    <!-- ═══ INTELLIGENCE ═══ -->
    <div class="page" id="page-intel">
      <div class="page-content">
        <div class="page-grid" id="intel-kpis"></div>
        <div class="page-grid" style="grid-template-columns:1fr 1fr">
          <div class="page-section"><div class="title">Active Model</div><div id="intel-model"></div></div>
          <div class="page-section"><div class="title">Last Route</div><div id="intel-route"></div></div>
        </div>
        <div class="page-section"><div class="title">Providers</div><div id="intel-providers"></div></div>
      </div>
    </div>

    <!-- ═══ MEMORY ═══ -->
    <div class="page" id="page-memory">
      <div class="page-content">
        <div class="page-grid" id="mem-kpis"></div>
        <div class="page-section"><div class="title">Memory Store</div><div id="mem-details"></div></div>
      </div>
    </div>

    <!-- ═══ COMPUTE ═══ -->
    <div class="page" id="page-compute">
      <div class="page-content">
        <div class="page-grid" id="comp-kpis"></div>
        <div class="page-section"><div class="title">Resources</div><div id="comp-res"></div></div>
        <div class="page-section"><div class="title">Workers</div><div id="comp-workers"></div></div>
      </div>
    </div>

    <!-- ═══ TOKENS ═══ -->
    <div class="page" id="page-tokens">
      <div class="page-content">
        <div class="page-grid" id="tok-kpis"></div>
        <div class="page-section"><div class="title">Budget</div><div id="tok-budget"></div></div>
        <div class="page-section"><div class="title">Details</div><div id="tok-details"></div></div>
      </div>
    </div>

    <!-- ═══ EVOLUTION ═══ -->
    <div class="page" id="page-evo">
      <div class="page-content">
        <div class="page-grid" id="evo-kpis"></div>
        <div class="page-section"><div class="title">Pipeline</div><div id="evo-pipeline"></div></div>
        <div class="page-section"><div class="title">Experiments</div><div id="evo-list"></div></div>
      </div>
    </div>

    <!-- ═══ ACTIVITY ═══ -->
    <div class="page" id="page-activity">
      <div class="page-content">
        <div class="page-section"><div class="title">Event Stream</div><div id="full-feed"></div></div>
      </div>
    </div>

    <!-- ═══ SETTINGS ═══ -->
    <div class="page" id="page-settings">
      <div class="page-content">
        <div class="page-grid" id="set-config"></div>
        <div class="page-section"><div class="title">Feature Flags</div><div id="set-flags"></div></div>
        <div class="page-section"><div class="title">GOD Profiles</div><div id="set-profiles"></div></div>
      </div>
    </div>

    <!-- ═══ CHAT ═══ -->
    <div class="chat-area">
      <div class="chat-toggle" id="chat-toggle">
        <div class="title">GOD · Chat</div>
        <div class="arrow" id="chat-arrow">▲</div>
      </div>
      <div class="chat-body" id="chat-body">
        <div class="chat-msgs" id="chat-msgs"></div>
        <div class="chat-quick" id="chat-quick"></div>
        <form class="chat-input-row" id="chat-form">
          <input id="chat-in" autocomplete="off" placeholder="Fala comigo..."/>
          <button class="chat-send" type="submit">Enviar</button>
        </form>
      </div>
    </div>

  </div>
</div>

<script>
/* ═══ Helpers ═══ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n);
const lc={INFO:'info',NOTICE:'info',WARNING:'warn',CRITICAL:'crit',SECURITY:'crit',OPPORTUNITY:'info',EVOLUTION:'evo'};

let S=null, chatLen=0, chatOpen=false, flagsLoaded=false;

/* ═══ Clock ═══ */
const updateClock=()=>{
  $('clock').textContent=new Intl.DateTimeFormat('pt-PT',{timeZone:'Europe/Lisbon',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date());
};
setInterval(updateClock,1000);updateClock();

/* ═══ Nav ═══ */
const PAGE_NAMES={home:'GOD · Home',intel:'GOD · Intelligence',memory:'GOD · Memory',compute:'GOD · Compute',tokens:'GOD · Tokens',evo:'GOD · Evolution',activity:'GOD · Activity',settings:'GOD · Settings'};
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('page-'+b.dataset.page).classList.add('active');
  $('page-name').textContent=PAGE_NAMES[b.dataset.page]||'GOD';
  if(b.dataset.page==='settings'&&!flagsLoaded)loadFlags();
}));

/* ═══ Chat ═══ */
$('chat-toggle').addEventListener('click',()=>{
  chatOpen=!chatOpen;
  $('chat-body').classList.toggle('open',chatOpen);
  $('chat-arrow').style.transform=chatOpen?'rotate(180deg)':'rotate(0)';
});
$('chat-form').addEventListener('submit',e=>{
  e.preventDefault();
  const v=$('chat-in').value.trim();
  if(v){fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:v})});$('chat-in').value='';}
});
const QA=[{l:'Estado',q:'estado'},{l:'Missão',q:'missão actual'},{l:'Roadmap',q:'roadmap'},{l:'Tokens',q:'economia de tokens'},{l:'Benchmark',q:'corre benchmark'}];
$('chat-quick').innerHTML=QA.map(a=>`<button class="qbtn" data-q="${esc(a.q)}">${esc(a.l)}</button>`).join('');
document.querySelectorAll('.qbtn').forEach(b=>b.addEventListener('click',()=>fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:b.dataset.q})})));

/* ═══ GOD CORE STATE ═══ */
let coreState='idle', coreTimer=null;
function setCore(st,label,ms){
  clearTimeout(coreTimer);
  coreState=st;
  $('god-core').dataset.state=st;
  if(label)$('core-status').textContent=label;
  if(ms)coreTimer=setTimeout(()=>setCore('ready','Pronta'),ms);
}

/* ═══ PAINT ═══ */
function paint(s){
  S=s;
  paintStatus(s);
  paintCore(s);
  paintKPIs(s);
  paintSysmap(s);
  paintFeed(s);
  paintIntel(s);
  paintMemory(s);
  paintCompute(s);
  paintTokens(s);
  paintEvo(s);
  paintActivity(s);
  paintConfig(s);
  paintProfiles(s);
  paintChat(s);
}

function paintStatus(s){
  const llm=(s.providers||[]).some(p=>p.available);
  const alerts=(s.eye&&s.eye.alerts)||[];
  const crit=alerts.some(a=>a.level==='CRITICAL'||a.level==='SECURITY');
  let cls='ok',lb='System Healthy';
  if(!llm){cls='crit';lb='No LLM';}
  else if(crit){cls='crit';lb='Critical';}
  else if(alerts.length){cls='warn';lb=alerts.length+' Alert'+(alerts.length>1?'s':'');}
  $('sys-badge').className='sys-badge '+cls;
  $('sys-label').textContent=lb;
  // Voice
  const vb=$('voice-badge');
  if(s.voice_ready){vb.classList.add('ready');vb.innerHTML='<div class="dot"></div> MIC · Ready';}
  else{vb.classList.remove('ready');vb.innerHTML='<div class="dot"></div> MIC';}
}

function paintCore(s){
  const llm=(s.providers||[]).some(p=>p.available);
  const lp=s.last_pipeline||{};
  const alerts=(s.eye&&s.eye.alerts)||[];
  const hasCrit=alerts.some(a=>a.level==='CRITICAL'||a.level==='SECURITY');
  if(!llm&&!s.mode){setCore('offline','Offline');return;}
  if(hasCrit){setCore('error','Atenção necessária');return;}
  if(coreState==='thinking'||coreState==='listening'||coreState==='tools'||coreState==='responding')return; // don't override active states
  if(lp.latency_ms!=null){setCore('ready','Pronta');}
  else{setCore('ready','Pronta');}
}

function paintKPIs(s){
  const h=s.host||{},u=s.usage||{},c=s.cache||{};
  const llm=(s.providers||[]).some(p=>p.available);
  const lp=s.last_pipeline||{};
  const td=s.token||{},ms=(td.models||{}).models||[],top=ms[0];
  const mem=s.memory||{};
  let hp=0;if(llm)hp+=40;if(h.load1&&h.cpu_count)hp+=Math.max(0,30-(h.load1/h.cpu_count*30));if(c.hit_rate!=null)hp+=Math.round(c.hit_rate*30);
  $('kpi-strip').innerHTML=`
    <div class="kpi"><div class="label">Health</div><div class="value" style="color:${hp>70?'var(--ok)':hp>40?'var(--warn)':'var(--crit)'}">${hp}%</div></div>
    <div class="kpi"><div class="label">AI</div><div class="value" style="font-size:13px">${top?esc(top.model.split('/').pop()):'None'}</div><div class="sub">${top?esc(top.provider||''):'Not connected'}</div></div>
    <div class="kpi"><div class="label">Response</div><div class="value">${lp.latency_ms!=null?lp.latency_ms+'ms':'—'}</div></div>
    <div class="kpi"><div class="label">Memory</div><div class="value">${fmtN(mem.total||0)}</div></div>
    <div class="kpi"><div class="label">Tokens</div><div class="value">${fmtN(u.session_tokens||0)}</div></div>
    <div class="kpi"><div class="label">CPU</div><div class="value">${h.load1&&h.cpu_count?Math.round(h.load1/h.cpu_count*100)+'%':'—'}</div></div>
  `;
}

function paintSysmap(s){
  const llm=(s.providers||[]).some(p=>p.available);
  const qd=s.qdrant||{},os=s.os||{},q=s.queue||{};
  const nodes=[
    {name:'AI Core',on:llm,val:llm?'Online':'Offline'},
    {name:'Memory',on:qd.available,val:qd.available?'Qdrant':'SQLite'},
    {name:'Compute',on:true,val:'Active'},
    {name:'Governor',on:s.governor&&s.governor.strict,val:s.governor&&s.governor.strict?'Strict':'Lax'},
    {name:'OS',on:os.booted,val:os.booted?'Booted':'Offline'},
    {name:'Queue',on:true,val:(q.queued||0)+' pending'},
  ];
  $('sysmap').innerHTML=nodes.map(n=>`<div class="map-row"><div class="map-dot ${n.on?'on':'off'}"></div><div class="map-name">${n.name}</div><div class="map-val">${n.val}</div></div>`).join('');
}

function paintFeed(s){
  const evs=(s.events||[]).slice(0,12);
  $('feed').innerHTML=evs.length?evs.map(e=>`<div class="feed-row"><div class="feed-ts">${new Date(e.ts).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div><div class="feed-msg ${lc[e.level]||'info'}"><div class="feed-dot"></div></div><div class="feed-msg">${esc(e.msg||e.name)}</div></div>`).join(''):'<div class="empty">Sem actividade</div>';
}

function paintIntel(s){
  const td=s.token||{},ms=(td.models||{}).models||[],top=ms[0];
  const lp=s.last_pipeline||{},u=s.usage||{};
  const ps=s.providers||[];
  $('intel-kpis').innerHTML=`
    <div class="pcard"><div class="label">LLM Calls</div><div class="value" style="color:var(--accent)">${u.llm_calls||0}</div></div>
    <div class="pcard"><div class="label">Tool Calls</div><div class="value" style="color:var(--info)">${u.tool_calls||0}</div></div>
    <div class="pcard"><div class="label">Latency</div><div class="value" style="color:var(--ok)">${lp.latency_ms!=null?lp.latency_ms+'ms':'—'}</div></div>
    <div class="pcard"><div class="label">Providers Up</div><div class="value" style="color:var(--ok)">${ps.filter(p=>p.available).length}/${ps.length}</div></div>
  `;
  $('intel-model').innerHTML=top?`<div style="font-family:var(--mono);font-size:14px;margin-bottom:4px">${esc(top.model.split('/').pop())}</div><div style="font-size:11px;color:var(--muted)">${esc(top.provider||'')} · ${top.n||0} requests · ${fmtN(top.tokens||0)} tok</div>`:'<div class="empty">No model</div>';
  $('intel-route').innerHTML=lp.route?`<div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:4px">${lp.route.join(' → ')}</div><div style="font-size:11px;color:var(--dim)">Cache: ${lp.cache||'miss'}</div>`:'<div class="empty">No data</div>';
  $('intel-providers').innerHTML=ps.map(p=>`<div class="item"><div><span style="font-weight:500">${esc(p.name)}</span> <span style="font-size:10px;color:var(--dim)">${(p.models||[]).slice(0,2).join(', ')}</span></div><span class="tag ${p.available?'ok':'off'}">${p.available?'● Up':'○ Down'}</span></div>`).join('');
}

function paintMemory(s){
  const m=s.memory||{},c=s.cache||{},qd=s.qdrant||{};
  const total=(m.session||0)+(m.semantic||0)+(m.project||0);
  $('mem-kpis').innerHTML=`
    <div class="pcard"><div class="label">Session</div><div class="value" style="color:var(--evo)">${m.session||0}</div></div>
    <div class="pcard"><div class="label">Semantic</div><div class="value" style="color:var(--info)">${m.semantic||0}</div></div>
    <div class="pcard"><div class="label">Total</div><div class="value" style="color:var(--ok)">${total}</div></div>
    <div class="pcard"><div class="label">Cache Hit</div><div class="value" style="color:var(--accent)">${c.hit_rate!=null?Math.round(c.hit_rate*100)+'%':'—'}</div></div>
  `;
  $('mem-details').innerHTML=`<div style="font-size:11px;color:var(--muted);line-height:1.8">
    <div>Qdrant: ${qd.available?'Connected':'Offline'} · ${qd.embed?qd.embed.method:'HashingVectorizer'}</div>
    <div>Cache: ${c.hits||0} hits · ${c.misses||0} misses · ${c.entries||0} entries</div>
    <div>Projects: ${m.project||0}</div>
  </div>`;
}

function paintCompute(s){
  const h=s.host||{},ws=s.workers||[];
  const cpu=h.load1&&h.cpu_count?Math.round(h.load1/h.cpu_count*100):null;
  const ram=h.ram_avail_mb?(h.ram_avail_mb/1024).toFixed(1):null;
  const ramT=h.ram_total_mb?(h.ram_total_mb/1024).toFixed(1):null;
  const ramPct=ramT&&ram?Math.round((1-ram/ramT)*100):null;
  $('comp-kpis').innerHTML=`
    <div class="pcard"><div class="label">CPU</div><div class="value" style="color:${cpu>80?'var(--crit)':cpu>60?'var(--warn)':'var(--ok)'}">${cpu!=null?cpu+'%':'—'}</div></div>
    <div class="pcard"><div class="label">RAM</div><div class="value" style="color:var(--info)">${ramPct!=null?ramPct+'%':'—'}</div><div class="sub">${ram?ram+'GB free':''}</div></div>
    <div class="pcard"><div class="label">GPU</div><div class="value" style="font-size:14px;color:var(--dim)">${h.gpu&&h.gpu.present?'Detected':'N/A'}</div></div>
    <div class="pcard"><div class="label">Workers</div><div class="value" style="color:var(--accent)">${ws.length}</div></div>
  `;
  $('comp-res').innerHTML=`
    <div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)"><span>CPU</span><span>${cpu!=null?cpu+'%':'—'}</span></div><div class="progress"><div class="progress-fill" style="width:${cpu||0}%;background:${cpu>80?'var(--crit)':cpu>60?'var(--warn)':'var(--ok)'}"></div></div><div style="font-size:10px;color:var(--dim)">${h.cpu_count||'?'} cores · load ${h.load1||'?'}</div></div>
    <div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)"><span>RAM</span><span>${ram?ram+'GB free':'—'}${ramT?' / '+ramT+'GB':''}</span></div><div class="progress"><div class="progress-fill" style="width:${ramPct||0}%;background:var(--info)"></div></div></div>
  `;
  $('comp-workers').innerHTML=ws.length?ws.map(w=>`<div class="item"><div><span style="font-weight:500">${esc(w.id)}</span> <span style="font-size:10px;color:var(--dim)">${esc(w.location)}</span></div><span class="tag ${w.alive?'ok':'off'}">${w.alive?'● Alive':'○ Dead'}</span></div>`).join(''):'<div class="empty">Nenhum worker remoto conectado</div>';
}

function paintTokens(s){
  const t=s.token||{},u=t.usage||{},c=t.cost||{},b=s.budgets||{};
  const eff=t.efficiency;
  $('tok-kpis').innerHTML=`
    <div class="pcard"><div class="label">Used</div><div class="value" style="color:var(--accent)">${fmtN(u.sum_actual||0)}</div></div>
    <div class="pcard"><div class="label">LLM</div><div class="value" style="color:var(--info)">${u.llm_calls||0}</div></div>
    <div class="pcard"><div class="label">Tools</div><div class="value" style="color:var(--ok)">${u.tool_calls||0}</div></div>
    <div class="pcard"><div class="label">Efficiency</div><div class="value" style="color:var(--evo)">${eff!=null?Math.round(eff*100)+'%':'—'}</div></div>
  `;
  const sp=u.session_tokens||0,sb=b.session||50000;
  $('tok-budget').innerHTML=`
    <div style="display:flex;gap:14px;margin-bottom:10px">
      <div><div style="font-size:9px;color:var(--dim)">Task</div><div style="font-family:var(--mono);font-size:14px">${b.task||8000}</div></div>
      <div><div style="font-size:9px;color:var(--dim)">Session</div><div style="font-family:var(--mono);font-size:14px">${sb}</div></div>
      <div><div style="font-size:9px;color:var(--dim)">Daily</div><div style="font-family:var(--mono);font-size:14px">${b.daily||200000}</div></div>
    </div>
    <div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)"><span>Session</span><span>${fmtN(sp)} / ${fmtN(sb)}</span></div><div class="progress"><div class="progress-fill" style="width:${Math.min(Math.round(sp/sb*100),100)}%;background:${sp/sb>.8?'var(--crit)':sp/sb>.6?'var(--warn)':'var(--ok)'}"></div></div></div>
  `;
  $('tok-details').innerHTML=`<div style="font-size:11px;color:var(--muted);line-height:1.8"><div>Estimated: ${u.sum_estimated||0}</div><div>Cost: ${esc(c.kind||'UNKNOWN')} · ${esc(c.reason||'No source')}</div></div>`;
}

function paintEvo(s){
  const exps=s.experiments||[];
  const pend=exps.find(e=>e.status==='pending');
  const applied=exps.filter(e=>e.status==='applied').length;
  $('evo-kpis').innerHTML=`
    <div class="pcard"><div class="label">Applied</div><div class="value" style="color:var(--ok)">${applied}</div></div>
    <div class="pcard"><div class="label">Pending</div><div class="value" style="color:var(--warn)">${pend?1:0}</div></div>
    <div class="pcard"><div class="label">Total</div><div class="value" style="color:var(--evo)">${exps.length}</div></div>
  `;
  $('evo-pipeline').innerHTML=`<div style="display:flex;gap:4px;flex-wrap:wrap;font-size:10px">${['Observe','Detect','Propose','Test','Approve','Apply'].map((x,i)=>`<div style="padding:4px 10px;background:rgba(110,231,183,.06);border:1px solid rgba(110,231,183,.15);border-radius:6px">${x}</div>${i<5?'<div style="color:var(--dim)">→</div>':''}`).join('')}</div>${pend?`<div style="margin-top:10px;padding:8px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:8px"><div style="font-weight:500;margin-bottom:4px">${esc(pend.title||pend.id)}</div><div style="display:flex;gap:6px"><button class="tag ok" onclick="fetch('/api/experiment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:'${esc(pend.id)}',approve:true})})">✓ Adopt</button><button class="tag crit" onclick="fetch('/api/experiment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:'${esc(pend.id)}',approve:false})})">✗ Reject</button></div></div>`:''}`;
  $('evo-list').innerHTML=exps.length?exps.slice(0,8).map(e=>`<div class="item"><div>${esc(e.title||e.id)}</div><span class="tag ${e.status==='applied'?'ok':e.status==='pending'?'warn':'off'}">${esc(e.status)}</span></div>`).join(''):'<div class="empty">Sem experiências</div>';
}

function paintActivity(s){
  const evs=s.events||[];
  $('full-feed').innerHTML=evs.length?evs.map(e=>`<div class="feed-row"><div class="feed-ts">${new Date(e.ts).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div><div class="feed-msg ${lc[e.level]||'info'}"><div class="feed-dot"></div></div><div class="feed-msg" style="white-space:normal">${esc(e.name)}<div style="font-size:10px;color:var(--dim)">${esc(e.msg)}</div></div></div>`).join(''):'<div class="empty">Sem eventos</div>';
}

function paintConfig(s){
  const gov=s.governor||{},q=s.queue||{},mi=s.mission||{};
  $('set-config').innerHTML=`
    <div class="pcard"><div class="label">Mode</div><div class="value" style="font-size:14px">${esc(s.mode||'?')}</div><div class="sub">${esc((s.mode_reason||'').slice(0,50))}</div></div>
    <div class="pcard"><div class="label">Governor</div><div class="value" style="font-size:14px">${gov.strict?'Strict':'Lax'}</div></div>
    <div class="pcard"><div class="label">Queue</div><div class="value">${q.queued||0}</div><div class="sub">${q.running||0} running</div></div>
    <div class="pcard"><div class="label">Missions</div><div class="value">${mi.n||0}</div><div class="sub">${mi.active?esc(mi.active.id):'None'}</div></div>
  `;
}

function loadFlags(){
  flagsLoaded=true;
  fetch('/api/system/flags').then(r=>r.json()).then(f=>{
    const en=f.enabled||[],dis=f.disabled||[],high=f.high_risk||[];
    $('set-flags').innerHTML=`
      <div style="display:flex;gap:10px;margin-bottom:10px">
        <div style="flex:1;padding:8px;background:rgba(110,231,183,.06);border:1px solid rgba(110,231,183,.15);border-radius:8px;text-align:center"><div style="font-size:9px;color:var(--dim)">Enabled</div><div style="font-family:var(--mono);font-size:18px;color:var(--ok)">${en.length}</div></div>
        <div style="flex:1;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center"><div style="font-size:9px;color:var(--dim)">Disabled</div><div style="font-family:var(--mono);font-size:18px">${dis.length}</div></div>
        <div style="flex:1;padding:8px;background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.15);border-radius:8px;text-align:center"><div style="font-size:9px;color:var(--dim)">High Risk</div><div style="font-family:var(--mono);font-size:18px;color:var(--crit)">${high.length}</div></div>
      </div>
      ${[...en.map(n=>({n,on:true})),...dis.map(n=>({n,on:false}))].map(x=>`<div class="item"><span style="font-size:11px">${esc(x.n)}</span><span class="tag ${x.on?'ok':'off'}" style="font-size:8px">${x.on?'ON':'OFF'}</span></div>`).join('')}
    `;
  }).catch(()=>{$('set-flags').innerHTML='<div class="empty">Falhou</div>';});
}

function paintProfiles(s){
  const g=s.god||{},act=g.active||{},profs=g.profiles||[],vers=g.versions||[];
  $('set-profiles').innerHTML=`
    <div style="display:flex;gap:10px;margin-bottom:10px">
      <div style="flex:1;padding:8px;background:rgba(196,160,232,.06);border:1px solid rgba(196,160,232,.15);border-radius:8px;text-align:center"><div style="font-size:9px;color:var(--dim)">Profiles</div><div style="font-family:var(--mono);font-size:18px;color:var(--accent)">${profs.length}</div></div>
      <div style="flex:1;padding:8px;background:rgba(196,181,253,.06);border:1px solid rgba(196,181,253,.15);border-radius:8px;text-align:center"><div style="font-size:9px;color:var(--dim)">Versions</div><div style="font-family:var(--mono);font-size:18px;color:var(--evo)">${vers.length}</div></div>
    </div>
    <div style="margin-bottom:8px"><div style="font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px">Activo</div><div style="font-weight:500">${esc(act.name||'Default')}</div><div style="font-size:11px;color:var(--muted)">${esc((act.purpose||'').slice(0,80))}</div></div>
    ${profs.filter(p=>p.id!==act.id).slice(0,4).map(p=>`<div class="item"><div style="font-weight:500">${esc(p.name)}</div></div>`).join('')}
  `;
}

function paintChat(s){
  const msgs=s.chat||[];
  if(msgs.length===chatLen&&$('chat-msgs').children.length)return;
  chatLen=msgs.length;
  $('chat-msgs').innerHTML=msgs.map(m=>`<div class="msg ${m.role}"><div class="who">${m.role==='brain'?'GOD':'You'}</div>${esc(m.text)}</div>`).join('');
  $('chat-msgs').scrollTop=$('chat-msgs').scrollHeight;
  if(msgs.length&&!chatOpen){chatOpen=true;$('chat-body').classList.add('open');$('chat-arrow').style.transform='rotate(180deg)';}
}

/* ═══ SSE ═══ */
function connect(){
  const es=new EventSource('/api/stream');
  es.addEventListener('snapshot',e=>{
    try{const d=JSON.parse(e.data);paint(d);}catch(err){console.error(err);}
  });
  es.onerror=()=>{es.close();setTimeout(connect,2000);fetch('/api/state').then(r=>r.json()).then(paint).catch(()=>{});};
}
fetch('/api/state').then(r=>r.json()).then(paint).catch(()=>{
  $('sys-badge').className='sys-badge crit';
  $('sys-label').textContent='Offline';
  setCore('offline','Offline');
});
connect();

/* ═══ Visibility API — reduce work when tab hidden ═══ */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){/* could pause animations */}
});
</script>
